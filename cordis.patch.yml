- insert:
    - id: dsh-jianying-plugin
      name: 'dsh-jianying-plugin'
      config:
        installDirs:
          - 'E:/JianyingPro'
          - 'F:/JianyingPro'
        tempRoot: 'F:/Codex/.dsh-jianying-plugin'
        allowApply: false
        allowHostApply: true
        createBackup: true
        hostPollIntervalMs: 2000
        hostWorkflowTimeoutMs: 300000
